name: Build Azad Coin Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AzadCoin-Debit-Card-Patch-v2.zip.b64"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare verified stable Azad Coin source
        run: |
          mkdir app
          stable_commit=2ad1f1ee1c0be631dfab2436912760a265a107a8
          source_base=https://raw.githubusercontent.com/AzadPayApp915/AzadCoinOfficial-/$stable_commit
          curl -fsSL "$source_base/AzadCoin-Mobile-App-Complete.zip" -o /tmp/azad-base.zip
          unzip -q /tmp/azad-base.zip -d app
          curl -fsSL "$source_base/AzadCoin-Firebase-Patch.zip.b64" -o /tmp/firebase.b64
          base64 -d /tmp/firebase.b64 > /tmp/firebase.zip
          unzip -qo /tmp/firebase.zip -d app
          curl -fsSL "$source_base/AzadCoin-Functional-Wallet-Patch-Paths.zip.b64" -o /tmp/functional.b64
          base64 -d /tmp/functional.b64 > /tmp/functional.zip
          unzip -qo /tmp/functional.zip -d app
          base64 -d AzadCoin-Debit-Card-Patch-v2.zip.b64 > /tmp/debit-card.zip
          unzip -qo /tmp/debit-card.zip -d app

          python3 - <<'PY'
          path = "app/lib/screens/dashboard_screen.dart"
          text = open(path, encoding="utf-8").read()
          imports = """import 'transactions_screen.dart';
import 'swap_screen.dart';
import 'wallet_screen.dart';
import 'financial_screens.dart';
import 'program_screens.dart';
import 'package:url_launcher/url_launcher.dart';
"""
          assert "import 'transactions_screen.dart';" in text
          text = text.replace("import 'transactions_screen.dart';\n", imports, 1)
          old_actions = """          Row(children: [
            Expanded(child: _quick(Icons.savings_rounded, 'Islamic Staking', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const StakingScreen())))),
            const SizedBox(width: 10),
            Expanded(child: _quick(Icons.receipt_long_rounded, 'Transactions', () => Navigator.push(context, MaterialPageRoute(builder: (_) => const TransactionsScreen())))),
          ]),"""
          new_actions = """          GridView.count(
            crossAxisCount: 3,
            shrinkWrap: true,
            physics: const NeverScrollableScrollPhysics(),
            mainAxisSpacing: 12,
            crossAxisSpacing: 12,
            childAspectRatio: .86,
            children: [
              _quick(Icons.sensors_rounded, 'Live', () => _openOfficialRoute('/live')),
              _quick(Icons.swap_vert_rounded, 'Convert', () => _open(const SwapScreen())),
              _quick(Icons.send_rounded, 'Send AZAD', () => _open(const WalletScreen())),
              _quick(Icons.south_west_rounded, 'Deposit', () => _open(const DepositScreen())),
              _quick(Icons.diamond_outlined, 'Staking', () => _open(const StakingScreen())),
              _quick(Icons.north_east_rounded, 'Withdraw', () => _open(const WithdrawScreen())),
              _quick(Icons.card_giftcard_rounded, 'Gift', () => _open(const GiftScreen())),
              _quick(Icons.menu_book_rounded, 'Read Pockets', () => _openOfficialRoute('/read-pockets')),
              _quick(Icons.confirmation_num_outlined, 'Lottery', () => _openOfficialRoute('/lottery')),
              _quick(Icons.construction_rounded, 'Mining', () => _open(const MiningScreen())),
              _quick(Icons.groups_rounded, 'Referral', () => _open(const ReferralScreen())),
              _quick(Icons.workspace_premium_rounded, 'Ambassador', () => _open(const AmbassadorScreen())),
              _quick(Icons.emoji_events_outlined, 'Leaderboard', () => _open(const LeaderboardScreen())),
              _quick(Icons.account_balance_wallet_outlined, 'AFN Wallet', () => _open(const AfnWalletScreen())),
              _quick(Icons.description_outlined, 'Whitepaper', () => _open(const WhitepaperScreen())),
              _quick(Icons.bar_chart_rounded, 'Withdrawal Stats', () => _open(const WithdrawalStatsScreen())),
              _quick(Icons.wallet_rounded, 'Wallet', () => _open(const WalletScreen())),
              _quick(Icons.receipt_long_rounded, 'Transactions', () => _open(const TransactionsScreen())),
              _quick(Icons.credit_card_rounded, 'AZAD VISA Card', () => _open(const AzadVisaCardScreen())),
            ],
          ),"""
          assert old_actions in text, "Dashboard action section was not found"
          text = text.replace(old_actions, new_actions, 1)
          marker = "  double _number(dynamic value) => value is num ? value.toDouble() : double.tryParse('\$value') ?? 0;\n"
          helpers = """  void _open(Widget page) => Navigator.push(context, MaterialPageRoute(builder: (_) => page));
  Future<void> _openOfficialRoute(String route) async {
    final uri = Uri.https('azad-coin.com', route);
    if (!await launchUrl(uri, mode: LaunchMode.externalApplication) && mounted) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Could not open the official Azad Coin page.')),
      );
    }
  }

"""
          assert marker in text, "Dashboard helper marker was not found"
          text = text.replace(marker, helpers + marker, 1)
          open(path, "w", encoding="utf-8").write(text)
          PY
          python3 - <<'PY'
          path = "app/lib/screens/dashboard_screen.dart"
          text = open(path, encoding="utf-8").read()
          old = "width: 1.15))))),"
          new = "width: 1.15)))))),"
          assert old in text, "Expected debit-card pattern was not found"
          open(path, "w", encoding="utf-8").write(text.replace(old, new, 1))
          PY
          sed -i 's/intl: ^0.19.0/intl: ^0.20.3/' app/pubspec.yaml
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' app/lib/theme/app_theme.dart
          rm -f app/test/widget_test.dart

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure original Android application
        working-directory: app
        run: |
          flutter create --platforms=android --org com.azadcoin --project-name azad_coin_app .
          rm -f test/widget_test.dart
          sed -i 's/com.azadcoin.azad_coin_app/com.azadcoin/g' android/app/build.gradle.kts
          sed -i 's/com.example.azad_coin_app/com.azadcoin/g' android/app/build.gradle.kts
          find android/app/src/main/kotlin -name MainActivity.kt -exec sed -i 's/^package .*/package com.azadcoin/; s/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/; s/FlutterActivity/FlutterFragmentActivity/' {} \;
          cp google-services.json android/app/google-services.json
          sed -i '/<application/i\ <uses-permission android:name="android.permission.INTERNET"/>\n <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="azad_coin_app"/android:label="Azad Coin"/' android/app/src/main/AndroidManifest.xml
          sed -i '/id("com.android.application") version/a\ id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\ id("com.google.gms.google-services")' android/app/build.gradle.kts
          sed -i '/^android {/a\ compileOptions {\n isCoreLibraryDesugaringEnabled = true\n sourceCompatibility = JavaVersion.VERSION_1_8\n targetCompatibility = JavaVersion.VERSION_1_8\n }' android/app/build.gradle.kts
          printf '\ndependencies {\n coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts

      - name: Build original app with debit card update
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azad-Coin-APK-Debit-Card-Update
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Azad-Coin-AAB-Debit-Card-Update
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
