name: Build Azad Coin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AzadCoin-Mobile-App-Complete.zip"
      - "AzadCoin-Firebase-Patch.zip.b64"
      - "AzadCoin-Functional-Wallet-Patch-Paths-v3.zip.b64"
      - "services_screen.fixed.dart"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Flutter source
        run: |
          mkdir app
          unzip -q AzadCoin-Mobile-App-Complete.zip -d app
          base64 -d AzadCoin-Firebase-Patch.zip.b64 > /tmp/firebase.zip
          unzip -qo /tmp/firebase.zip -d app
          base64 -d AzadCoin-Functional-Wallet-Patch-Paths-v3.zip.b64 > /tmp/functional.zip
          unzip -qo /tmp/functional.zip -d app
          cp services_screen.fixed.dart app/lib/screens/services_screen.dart
          sed -i 's/intl: ^0.20.3/intl: ^0.19.0/' app/pubspec.yaml
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' app/lib/theme/app_theme.dart
          rm -f app/test/widget_test.dart
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - name: Configure native Android app
        working-directory: app
        run: |
          rm -rf android
          flutter create --platforms=android --project-name azad_coin_app .
          mkdir -p android/app/src/main/kotlin/com/azadcoin
          mv android/app/src/main/kotlin/com/example/azad_coin_app/MainActivity.kt android/app/src/main/kotlin/com/azadcoin/MainActivity.kt
          sed -i 's/package com.example.azad_coin_app/package com.azadcoin/' android/app/src/main/kotlin/com/azadcoin/MainActivity.kt
          sed -i 's/namespace = "com.example.azad_coin_app"/namespace = "com.azadcoin"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.azad_coin_app"/applicationId = "com.azadcoin"/' android/app/build.gradle.kts
          sed -i 's/android:label="azad_coin_app"/android:label="Azad Coin"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> android/app/build.gradle.kts
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azad-Coin-com.azadcoin-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
