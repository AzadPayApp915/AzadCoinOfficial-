name: Build Azad Coin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AzadCoin-Mobile-App-Complete.zip"
      - "AzadCoin-Firebase-Patch.zip.b64"
      - "AzadCoin-Functional-Wallet-Patch-Paths-v3.zip.b64"
      - "services_screen.fixed.dart"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Firebase-enabled Flutter project
        run: |
          mkdir app
          unzip -q AzadCoin-Mobile-App-Complete.zip -d app
          base64 -d AzadCoin-Firebase-Patch.zip.b64 > /tmp/azad-firebase-patch.zip
          unzip -qo /tmp/azad-firebase-patch.zip -d app
          base64 -d AzadCoin-Functional-Wallet-Patch-Paths-v3.zip.b64 > /tmp/azad-functional-patch.zip
          unzip -t /tmp/azad-functional-patch.zip
          unzip -qo /tmp/azad-functional-patch.zip -d app
          cp services_screen.fixed.dart app/lib/screens/services_screen.dart
          sed -i 's/intl: ^0.19.0/intl: ^0.20.3/' app/pubspec.yaml
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' app/lib/theme/app_theme.dart
          rm -f app/test/widget_test.dart

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azad-Coin-APK-Full-Functions
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
