name: Build Azad Coin Android APK




on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AzadCoin-Mobile-App-Complete.zip"
      - ".github/workflows/build-apk.yml"




jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4




      - name: Extract and repair Flutter project
        run: |
          mkdir app
          unzip -q AzadCoin-Mobile-App-Complete.zip -d app
          sed -i 's/intl: ^0.19.0/intl: ^0.20.3/' app/pubspec.yaml
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' app/lib/theme/app_theme.dart
          rm -f app/test/widget_test.dart




      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
