name: Build Azad Coin Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Flutter source
        run: |
          mkdir app
          unzip -q AzadCoin-Mobile-App-Complete.zip -d app
          base64 -d AzadCoin-Firebase-Patch.zip.b64 > /tmp/firebase.zip
          unzip -qo /tmp/firebase.zip -d app
          base64 -d AzadCoin-Functional-Wallet-Patch-Paths-v3.zip.b64 > /tmp/functional.zip
          unzip -qo /tmp/functional.zip -d app
          cp services_screen.fixed.dart app/lib/screens/services_screen.dart
          sed -i 's/intl: ^0.20.3/intl: ^0.19.0/' app/pubspec.yaml
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' app/lib/theme/app_theme.dart
          rm -f app/test/widget_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Azad-Coin-APK-Full-Functions
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
